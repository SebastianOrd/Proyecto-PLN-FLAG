version: '3.8'

services:
  # API principal: Clasificación + Resumen (Python 3.11)
  api-summary:
    build:
      context: .
      dockerfile: Dockerfile.summary
    container_name: biolaysum-api-summary
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    networks:
      - biolaysum-network
    gpus: "all" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3   
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 12g
    logging:              # ← ← ← AQUÍ
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  # API de métricas (Python 3.10)
  api-metrics:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: biolaysum-api-metrics
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
    command: uvicorn src.api.metrics.server:app --host 0.0.0.0 --port 8001
    networks:
      - biolaysum-network
    gpus: "all" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  # Frontend Streamlit
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: biolaysum-streamlit
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
    depends_on:
      - api-summary
      - api-metrics
    networks:
      - biolaysum-network
    command: streamlit run src/ui/app_streamlit.py --server.port=8501 --server.address=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
networks:
  biolaysum-network:
    driver: bridge
volumes:
  hf-cache: